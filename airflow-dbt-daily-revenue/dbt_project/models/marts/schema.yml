version: 2

models:
  - name: fct_daily_revenue
    description: "Daily aggregated revenue from completed orders."
    columns:
      - name: revenue_date
        description: "The calendar date of the orders."
        tests:
          - unique
          - not_null
      - name: total_completed_orders
        description: "Count of completed orders on this date."
        tests:
          - not_null
      - name: total_revenue
        description: "Sum of total_amount for completed orders."
        tests:
          - not_null
